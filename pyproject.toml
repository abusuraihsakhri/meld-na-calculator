[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meld-na-calculator"
version = "1.0.0"
description = "MELD-Na / MELD 3.0 Calculator — liver transplant scoring"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["meld_na", "cli", "enrichment", "simulator"]
