name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project with test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check Python syntax
        run: python -m compileall -q agents meld_na.py cli.py enrichment.py simulator.py tests test_meld_na.py
      - name: Run pytest
        run: python -m pytest -q
      - name: Run independent legacy test harness
        run: python test_meld_na.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check client JavaScript syntax
        run: node --check web/calculator.js
      - name: Verify formulas in browser JavaScript
        run: node --test web/test_calculator.cjs
      - name: Check static entry points
        run: |
          test -s web/index.html
          test -s web/calculator.js
          grep -q 'src="./calculator.js"' web/index.html
